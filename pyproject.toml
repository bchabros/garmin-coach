[tool.poetry]
name = "garmin-coach"
version = "0.1.1"
description = "Local Garmin Connect ETL + training coach (system-of-record in SQLite)"
authors = ["Chabros <chabros96@gmail.com>"]
readme = "README.md"
packages = [{ include = "garmin_coach", from = "src" }]
include = [
    { path = "skills/coach/SKILL.md", format = ["sdist", "wheel"] },
    { path = "skills/coach/references/report.md", format = ["sdist", "wheel"] },
    { path = "skills/coach/references/planning.md", format = ["sdist", "wheel"] },
    { path = "skills/coach/references/authoring.md", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.13"
garminconnect = "*"
curl-cffi = "*"
# cryptography 49 removed Intel macOS wheels; retain the last native binary release there.
cryptography = [
    { version = "48.0.1", markers = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { version = "49.0.0", markers = "sys_platform != 'darwin' or platform_machine != 'x86_64'" },
]
pydantic = "*"
pydantic-settings = "*"
python-dotenv = "*"
matplotlib = "^3.11.0"
mcp = "^1.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"

[tool.poetry.scripts]
garmin-coach = "garmin_coach.cli:main"
garmin-coach-mcp = "garmin_coach.mcp.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
